# Release: update VERSION + CHANGELOG.md, then run `make release` (pushes tag vX.Y.Z).
# The tag triggers this workflow: DMG + signed Sparkle appcast + SHA256SUMS -> GitHub Release.
# One-time: set repo secret SPARKLE_ED_PRIVATE_KEY (output of `generate_keys -x`).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # needed to create GitHub Releases

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "16.2"

      - name: Install build tools
        run: brew install xcodegen create-dmg

      - name: Verify tag matches VERSION
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)" || { echo "::error::tag ${GITHUB_REF_NAME} != v$(cat VERSION)"; exit 1; }

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build DMG
        run: make dmg

      - name: Sign appcast and checksums
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_ED_PRIVATE_KEY" || { echo "::error::SPARKLE_ED_PRIVATE_KEY secret is not set"; exit 1; }
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | make release-assets SPARKLE_KEY_FILE=-

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "build/release/IPGlance-$(cat VERSION).md" \
            build/release/IPGlance-*.dmg build/release/appcast.xml build/release/SHA256SUMS
