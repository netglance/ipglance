# Release: update VERSION + CHANGELOG.md, then run `make release` (pushes tag vX.Y.Z from main).
# The tag triggers this workflow: `build` makes the DMG with no secrets; `publish` (clean runner,
# no repo code, pinned Sparkle tools) signs the appcast, checksums it and creates the GitHub Release.
# One-time: set environment secret SPARKLE_ED_PRIVATE_KEY in the `release` environment (output of `generate_keys -x`).
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "16.2"

      - name: Install XcodeGen (pinned)
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
        run: |
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Install create-dmg (pinned)
        env:
          CREATE_DMG_VERSION: "1.3.0"
          CREATE_DMG_SHA256: "c50d2bc97c3d6292642bac55f530d247eaf4bf65ee605f26b4caf339383e381c"
        run: |
          curl -sSfL -o "$RUNNER_TEMP/create-dmg.tar.gz" "https://github.com/create-dmg/create-dmg/archive/refs/tags/v${CREATE_DMG_VERSION}.tar.gz"
          echo "${CREATE_DMG_SHA256}  $RUNNER_TEMP/create-dmg.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/create-dmg.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/create-dmg-${CREATE_DMG_VERSION}" >> "$GITHUB_PATH"

      - name: Verify tag matches VERSION
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)" || { echo "::error::tag ${GITHUB_REF_NAME} != v$(cat VERSION)"; exit 1; }

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build DMG and release notes
        run: make dmg notes

      - name: Checksum DMG
        run: shasum -a 256 IPGlance-*.dmg > SHA256SUMS

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: |
            IPGlance-*.dmg
            SHA256SUMS
            build/release/IPGlance-*.md
          if-no-files-found: error
          retention-days: 1

  # Never checks out or runs repo code: the only executables are the checksum-pinned Sparkle tools.
  publish:
    needs: build
    environment: release
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: write  # needed to create GitHub Releases
    steps:
      - name: Verify the tag points at main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          case "$status" in identical|behind) ;; *) echo "::error::tag commit is not on main ($status)"; exit 1;; esac

      - name: Require green CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          WAIT_SECONDS: "720"
        run: |
          # state: ok = all three latest runs succeeded, bad = one completed unsuccessfully, wait = otherwise
          deadline=$((SECONDS + WAIT_SECONDS))
          while :; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" | jq -r '
              [.check_runs[]] as $r
              | [["swift test","xcodebuild release","gitleaks (secret scan)"][]
                 | . as $n | ($r | map(select(.name==$n)) | sort_by(.started_at) | last) // {}] as $l
              | if all($l[]; .status=="completed" and .conclusion=="success") then "ok"
                elif any($l[]; .status=="completed" and .conclusion!="success") then "bad"
                else "wait" end')
            case "$state" in
              ok) exit 0;;
              bad) echo "::error::a required CI check failed for $GITHUB_SHA"; exit 1;;
            esac
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::required CI checks did not finish green within ${WAIT_SECONDS}s for $GITHUB_SHA"; exit 1; }
            echo "CI still running, retrying in 30s"; sleep 30
          done

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release

      - name: Verify DMG checksum from build job
        run: cd release && shasum -a 256 -c SHA256SUMS

      - name: Fetch Sparkle tools (pinned)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/sparkle.tar.xz" https://github.com/sparkle-project/Sparkle/releases/download/2.9.2/Sparkle-2.9.2.tar.xz
          echo "1cb340cbbef04c6c0d162078610c25e2221031d794a3449d89f2f56f4df77c95  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/sparkle" && tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"

      - name: Sign appcast and checksums
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_ED_PRIVATE_KEY" || { echo "::error::SPARKLE_ED_PRIVATE_KEY secret is not set"; exit 1; }
          # artifact keeps relative paths; put the notes .md next to the dmg for generate_appcast
          mv release/build/release/IPGlance-*.md release/
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" --ed-key-file - \
            --embed-release-notes \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" release
          (cd release && shasum -a 256 IPGlance-*.dmg > SHA256SUMS)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "release/IPGlance-${GITHUB_REF_NAME#v}.md" \
            release/IPGlance-*.dmg release/appcast.xml release/SHA256SUMS
